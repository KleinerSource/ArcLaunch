name: Build ArcLaunch Keyboard Bridge

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      package_version:
        description: Independent keyboard bridge package version.
        value: ${{ jobs.build.outputs.package_version }}

permissions:
  contents: read

jobs:
  build:
    name: Build architecture packages
    runs-on: macos-15
    outputs:
      package_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute keyboard bridge version
        id: version
        run: |
          set -euo pipefail
          current_version="$(awk '$1 == "Version:" { print $2; exit }' KeyboardBridgeTweak/control)"
          if [[ ! "$current_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error title=Invalid plugin version::Expected x.y.z+build in KeyboardBridgeTweak/control, got $current_version"
            exit 1
          fi
          version="${BASH_REMATCH[1]}+$((10#${BASH_REMATCH[2]} + 1))"
          echo "Keyboard bridge package version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: brew install dpkg make

      - name: Install RootHide Theos and patched SDK
        env:
          THEOS: ${{ runner.temp }}/theos
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos | bash
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build arm64 and arm64e packages for all jailbreak layouts
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ArcLaunchKeyboardBridge"
          mkdir -p "$artifact_dir"
          version="${{ steps.version.outputs.version }}"
          echo "Keyboard bridge package version: $version"

          build_package() {
            local arch="$1"
            local package_arch="$2"
            local scheme="$3"
            gmake -C KeyboardBridgeTweak clean THEOS_PACKAGE_SCHEME="$scheme"
            rm -f KeyboardBridgeTweak/packages/*.deb
            gmake -C KeyboardBridgeTweak package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$scheme" ARCHS="$arch" THEOS_PACKAGE_ARCH="$package_arch" PACKAGE_VERSION="$version"

            local source_package
            source_package="$(find KeyboardBridgeTweak/packages -maxdepth 1 -type f -name "*_${package_arch}.deb" -print -quit)"
            test -n "$source_package"
            test "$(dpkg-deb -f "$source_package" Version)" = "$version"
            local source_root
            source_root="$(mktemp -d)"
            dpkg-deb -x "$source_package" "$source_root"
            local dylib_path
            dylib_path="$(find "$source_root" -type f -name ArcLaunchGuestKeyboardBridge.dylib -print -quit)"
            test -n "$dylib_path"
            local filters="${dylib_path%/ArcLaunchGuestKeyboardBridge.dylib}"
            test -s "$filters/ArcLaunchGuestKeyboardBridge.plist"
            test "$(lipo -archs "$dylib_path")" = "$arch"

            local package_root
            package_root="$(mktemp -d)"
            local payload="$package_root/var/mobile/Library/ArcLaunch/KeyboardBridge"
            mkdir -p "$package_root/DEBIAN" "$payload"
            cp "$dylib_path" "$payload/"
            cp "$filters/ArcLaunchGuestKeyboardBridge.plist" "$payload/"
            awk -v arch="$package_arch" -v version="$version" '/^[Aa]rchitecture:/ { print "Architecture: " arch; next } /^[Vv]ersion:/ { print "Version: " version; next } { print }' KeyboardBridgeTweak/control > "$package_root/DEBIAN/control"
            cp KeyboardBridgeTweak/postinst KeyboardBridgeTweak/prerm "$package_root/DEBIAN/"
            chmod 755 "$package_root/DEBIAN/postinst" "$package_root/DEBIAN/prerm"
            sh -n "$package_root/DEBIAN/postinst"
            sh -n "$package_root/DEBIAN/prerm"

            local package="$artifact_dir/ArcLaunchKeyboardBridge-${arch}.deb"
            dpkg-deb --build "$package_root" "$package"
            test "$(dpkg-deb -f "$package" Architecture)" = "$package_arch"
            test "$(dpkg-deb -f "$package" Version)" = "$version"

            local verify_root
            verify_root="$(mktemp -d)"
            dpkg-deb -x "$package" "$verify_root"
            test -s "$verify_root/var/mobile/Library/ArcLaunch/KeyboardBridge/ArcLaunchGuestKeyboardBridge.dylib"
            test -s "$verify_root/var/mobile/Library/ArcLaunch/KeyboardBridge/ArcLaunchGuestKeyboardBridge.plist"
            test "$(lipo -archs "$verify_root/var/mobile/Library/ArcLaunch/KeyboardBridge/ArcLaunchGuestKeyboardBridge.dylib")" = "$arch"
          }

          build_package arm64 iphoneos-arm64 rootless
          build_package arm64e iphoneos-arm64e roothide

      - name: Upload arm64 package
        uses: actions/upload-artifact@v7
        with:
          name: ArcLaunchKeyboardBridge-arm64
          path: ${{ runner.temp }}/ArcLaunchKeyboardBridge/ArcLaunchKeyboardBridge-arm64.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload arm64e package
        uses: actions/upload-artifact@v7
        with:
          name: ArcLaunchKeyboardBridge-arm64e
          path: ${{ runner.temp }}/ArcLaunchKeyboardBridge/ArcLaunchKeyboardBridge-arm64e.deb
          if-no-files-found: error
          retention-days: 30
