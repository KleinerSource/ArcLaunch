name: Build ArcLaunch Keyboard Bridge

on:
  push:
    paths:
      - "ArcLaunch/Services/FloatingAppSceneHost.m"
      - "KeyboardBridgeTweak/**"
      - ".github/workflows/build-keyboard-bridge.yml"
  pull_request:
    paths:
      - "ArcLaunch/Services/FloatingAppSceneHost.m"
      - "KeyboardBridgeTweak/**"
      - ".github/workflows/build-keyboard-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build jailbreak variants
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: brew install dpkg make

      - name: Install RootHide Theos and patched SDK
        env:
          THEOS: ${{ runner.temp }}/theos
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos | bash
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build rootful, rootless, and RootHide packages
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ArcLaunchKeyboardBridge"
          mkdir -p "$artifact_dir"

          build_package() {
            local arch="$1"
            local variant="$2"
            local scheme="$3"
            local package_arch="$4"
            gmake -C KeyboardBridgeTweak clean THEOS_PACKAGE_SCHEME="$scheme"
            rm -f KeyboardBridgeTweak/packages/*.deb
            gmake -C KeyboardBridgeTweak package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$scheme" ARCHS="$arch" THEOS_PACKAGE_ARCH="$package_arch"
            local package
            package="$(find KeyboardBridgeTweak/packages -maxdepth 1 -type f -name "*_${package_arch}.deb" -print -quit)"
            test -n "$package"
            test "$(dpkg-deb -f "$package" Architecture)" = "$package_arch"
            local stage
            stage="$(mktemp -d)"
            dpkg-deb -x "$package" "$stage"
            local filters
            case "$variant" in
              rootless) filters="$stage/var/jb/Library/MobileSubstrate/DynamicLibraries" ;;
              rootful|roothide) filters="$stage/Library/MobileSubstrate/DynamicLibraries" ;;
              *) echo "Unsupported package variant: $variant" >&2; return 1 ;;
            esac
            test -s "$filters/ArcLaunchGuestKeyboardBridge.dylib"
            lipo "$filters/ArcLaunchGuestKeyboardBridge.dylib" -verify_arch "$arch"
            test -s "$filters/ArcLaunchGuestKeyboardBridge.plist"
            cp "$package" "$artifact_dir/ArcLaunchKeyboardBridge-${arch}-${variant}.deb"
          }

          build_package arm64 rootful "" iphoneos-arm
          build_package arm64e rootful "" iphoneos-arm
          build_package arm64 rootless rootless iphoneos-arm64
          build_package arm64e rootless rootless iphoneos-arm64
          build_package arm64 roothide roothide iphoneos-arm64e
          build_package arm64e roothide roothide iphoneos-arm64e

      - name: Upload arm64 rootful package
        uses: actions/upload-artifact@v7
        with:
          name: ArcLaunchKeyboardBridge-arm64-rootful
          path: ${{ runner.temp }}/ArcLaunchKeyboardBridge/ArcLaunchKeyboardBridge-arm64-rootful.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload arm64e rootful package
        uses: actions/upload-artifact@v7
        with:
          name: ArcLaunchKeyboardBridge-arm64e-rootful
          path: ${{ runner.temp }}/ArcLaunchKeyboardBridge/ArcLaunchKeyboardBridge-arm64e-rootful.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload arm64 rootless package
        uses: actions/upload-artifact@v7
        with:
          name: ArcLaunchKeyboardBridge-arm64-rootless
          path: ${{ runner.temp }}/ArcLaunchKeyboardBridge/ArcLaunchKeyboardBridge-arm64-rootless.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload arm64e rootless package
        uses: actions/upload-artifact@v7
        with:
          name: ArcLaunchKeyboardBridge-arm64e-rootless
          path: ${{ runner.temp }}/ArcLaunchKeyboardBridge/ArcLaunchKeyboardBridge-arm64e-rootless.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload arm64 RootHide package
        uses: actions/upload-artifact@v7
        with:
          name: ArcLaunchKeyboardBridge-arm64-roothide
          path: ${{ runner.temp }}/ArcLaunchKeyboardBridge/ArcLaunchKeyboardBridge-arm64-roothide.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload arm64e RootHide package
        uses: actions/upload-artifact@v7
        with:
          name: ArcLaunchKeyboardBridge-arm64e-roothide
          path: ${{ runner.temp }}/ArcLaunchKeyboardBridge/ArcLaunchKeyboardBridge-arm64e-roothide.deb
          if-no-files-found: error
          retention-days: 30
